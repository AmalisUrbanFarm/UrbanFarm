<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Amalis Urban Farm">
  <title>Amalis Urban Farm</title>
  <link rel="icon" href="assets/amalis-logo.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #07120f;
      --muted: #62706a;
      --line: rgba(7, 18, 15, 0.12);
      --soft: #f6f8f5;
      --soft-2: #eef4f0;
      --green: #1b7a4a;
      --green-2: #5cb883;
      --steel: #d8e1df;
      --blue: #4f7d94;
      --gold: #b08a43;
      --white: #ffffff;
      --shadow: 0 24px 70px rgba(7, 18, 15, 0.12);
      --radius: 8px;
      --header: 72px;
      --section-y: 88px;
      --section-y-tablet: 76px;
      --section-y-mobile: 60px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--white);
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(238, 244, 240, 0.72), rgba(255,255,255,0) 360px),
        var(--white);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      opacity: 0.42;
      background-image:
        linear-gradient(rgba(7, 18, 15, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(7, 18, 15, 0.045) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(180deg, black, transparent 80%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    select {
      font: inherit;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      height: var(--header);
      border-bottom: 1px solid rgba(7, 18, 15, 0.08);
      background: rgba(255, 255, 255, 0.76);
      backdrop-filter: blur(18px);
    }

    .nav-shell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: min(1180px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      font-weight: 760;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand-logo {
      display: block;
      width: clamp(158px, 16vw, 230px);
      height: 42px;
      object-fit: contain;
      object-position: left center;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 13px;
      color: rgba(7, 18, 15, 0.72);
    }

    .nav-links a {
      transition: color 180ms ease;
    }

    .nav-links a:hover {
      color: var(--ink);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .language-select {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 34px 0 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.82);
      cursor: pointer;
    }

    .nav-login,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid rgba(7, 18, 15, 0.14);
      padding: 0 18px;
      font-size: 14px;
      font-weight: 680;
      letter-spacing: 0;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      cursor: pointer;
    }

    .nav-login {
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 12px 30px rgba(7, 18, 15, 0.16);
    }

    .btn.primary {
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 18px 46px rgba(7, 18, 15, 0.18);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.72);
      color: var(--ink);
    }

    .btn:hover,
    .nav-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 52px rgba(7, 18, 15, 0.17);
    }

    main {
      padding-top: var(--header);
    }

    .section {
      position: relative;
      min-height: auto;
      display: grid;
      align-items: center;
      overflow: hidden;
    }

    .section-inner {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: var(--section-y) 0;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
      color: var(--green);
      font-size: 13px;
      font-weight: 780;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: currentColor;
    }

    .display {
      margin: 0;
      max-width: 1050px;
      font-size: clamp(46px, 6.3vw, 92px);
      line-height: 0.98;
      letter-spacing: 0;
      font-weight: 820;
    }

    .hero .display {
      max-width: 520px;
      font-size: clamp(42px, 5.05vw, 74px);
      line-height: 1.04;
      color: transparent;
      background:
        linear-gradient(105deg, #07120f 0%, #07120f 34%, #1b7a4a 52%, #4f7d94 72%, #07120f 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .headline {
      margin: 0;
      max-width: 930px;
      font-size: clamp(42px, 6vw, 88px);
      line-height: 0.98;
      letter-spacing: 0;
      font-weight: 800;
    }

    .lead {
      margin: 32px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: clamp(18px, 2.2vw, 25px);
      line-height: 1.42;
    }

    .hero {
      min-height: auto;
    }

    .hero .section-inner {
      padding-top: 54px;
      padding-bottom: 66px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.98fr) minmax(360px, 0.82fr);
      column-gap: 56px;
      row-gap: 0;
      align-items: center;
    }

    .hero-copy {
      padding: 8px 0 32px;
    }

    .hero-roadmap {
      position: relative;
      width: min(1100px, 100%);
      grid-column: 1 / -1;
      justify-self: center;
      margin: 0 auto 18px;
      border: 0;
      border-radius: 0;
      padding: 2px 4px 6px;
      background: transparent;
      box-shadow: none;
    }

    .roadmap-title {
      margin: 0 0 10px;
      color: #2E7D32;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    .roadmap-track {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, minmax(92px, 1fr));
      gap: 0;
      align-items: start;
      padding-top: 10px;
    }

    .roadmap-track::before,
    .roadmap-track::after {
      content: "";
      position: absolute;
      left: 44px;
      right: 44px;
      top: 22px;
      height: 3px;
      border-radius: 999px;
    }

    .roadmap-track::before {
      background: linear-gradient(90deg, rgba(15,81,50,0.12), rgba(87,167,115,0.2), rgba(15,81,50,0.1));
    }

    .roadmap-track::after {
      right: auto;
      width: calc((100% - 88px) * 0.17);
      background: linear-gradient(90deg, #0F5132, #2E7D32, #57A773);
      transform-origin: left;
      animation: roadmapLine 2s cubic-bezier(0.22,1,0.36,1) both;
    }

    .roadmap-step {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--ink);
      text-align: center;
      opacity: 1;
      transform: translateY(0);
      animation: roadmapStep 720ms cubic-bezier(0.22,1,0.36,1);
      transition: transform 220ms cubic-bezier(0.22,1,0.36,1), filter 220ms ease;
    }

    .roadmap-step:nth-child(1) { animation-delay: 120ms; }
    .roadmap-step:nth-child(2) { animation-delay: 240ms; }
    .roadmap-step:nth-child(3) { animation-delay: 360ms; }
    .roadmap-step:nth-child(4) { animation-delay: 480ms; }
    .roadmap-step:nth-child(5) { animation-delay: 600ms; }
    .roadmap-step:nth-child(6) { animation-delay: 720ms; }
    .roadmap-step:nth-child(7) { animation-delay: 840ms; }

    .roadmap-step:hover {
      transform: translateY(-4px) scale(1.05);
      filter: drop-shadow(0 16px 24px rgba(7,18,15,0.1));
    }

    .roadmap-step:not(.done):not(.current) {
      color: #A0AAA3;
    }

    .roadmap-dot {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1px solid #D9E1DC;
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      color: #A0AAA3;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(10px);
    }

    .roadmap-step.done .roadmap-dot {
      width: 22px;
      height: 22px;
      border-color: #2E7D32;
      background: #2E7D32;
      color: #FFFFFF;
      animation: roadmapPulse 3.8s ease-in-out infinite;
    }

    .roadmap-step.current .roadmap-dot {
      width: 28px;
      height: 28px;
      border-color: #2E7D32;
      background: #2E7D32;
      color: #FFFFFF;
      box-shadow: 0 0 25px rgba(46,125,50,0.35);
      animation: roadmapPulse 3s ease-in-out infinite;
    }

    .roadmap-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-height: 58px;
    }

    .roadmap-label strong {
      max-width: 124px;
      font-size: 11px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .roadmap-label span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      background: rgba(243,245,244,0.72);
      color: #7d8982;
      font-size: 9px;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .roadmap-step.done .roadmap-label span,
    .roadmap-step.current .roadmap-label span {
      background: rgba(46,125,50,0.1);
      color: #2E7D32;
    }

    .roadmap-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 14px);
      width: max-content;
      max-width: 230px;
      border-radius: 14px;
      padding: 11px 13px;
      background: #111111;
      color: #FFFFFF;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .roadmap-tooltip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 12px;
      height: 12px;
      background: inherit;
      transform: translateX(-50%) rotate(45deg);
    }

    .roadmap-step:hover .roadmap-tooltip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .signal-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 36px;
      max-width: 650px;
    }

    .signal {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .signal strong {
      display: block;
      font-size: 28px;
      letter-spacing: 0;
    }

    .signal span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .world-visual {
      position: relative;
      min-height: 500px;
      isolation: isolate;
      transform: none;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 28px 90px rgba(7, 18, 15, 0.14);
      background: #f7faf7;
    }

    .orbit-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .network-hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      transform: scale(1.02);
    }

    .world-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.18), transparent 24%),
        radial-gradient(circle at 50% 55%, transparent 42%, rgba(255,255,255,0.16) 100%);
    }

    .data-pill {
      position: absolute;
      z-index: 4;
      border: 1px solid rgba(7, 18, 15, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      min-width: 132px;
      animation: float 6s ease-in-out infinite;
    }

    .data-pill span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 680;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .data-pill strong {
      display: block;
      margin-top: 8px;
      font-size: 21px;
    }

    .data-pill.one {
      left: 7%;
      top: 10%;
    }

    .data-pill.two {
      right: 6%;
      top: 18%;
      animation-delay: -2s;
    }

    .data-pill.three {
      left: 10%;
      bottom: 10%;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    @keyframes roadmapLine {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes roadmapStep {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes roadmapPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .problem {
      background: linear-gradient(180deg, #ffffff 0%, #f8faf8 100%);
      min-height: auto;
      align-items: start;
    }

    .problem .section-inner {
      padding: var(--section-y) 0;
    }

    .problem::before {
      content: "";
      position: absolute;
      left: -160px;
      top: 70px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46,125,50,0.08), transparent 70%);
      pointer-events: none;
    }

    .problem-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
      column-gap: 96px;
      row-gap: 42px;
      align-items: center;
    }

    .problem .eyebrow {
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 700;
      color: #2E7D32;
    }

    .problem .eyebrow::before {
      width: 28px;
      height: 2px;
    }

    .problem-title {
      max-width: 650px;
      font-size: clamp(48px, 6.4vw, 92px);
      line-height: 0.95;
      letter-spacing: -4px;
      color: #0A0A0A;
    }

    .problem-lead {
      max-width: 700px;
      font-size: clamp(20px, 2.1vw, 26px);
      line-height: 1.4;
      color: #5F6762;
    }

    .problem-metrics {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      isolation: isolate;
    }

    .problem-metrics::before {
      content: "";
      position: absolute;
      inset: -40px;
      z-index: -1;
      opacity: 0.06;
      background:
        linear-gradient(28deg, transparent 0 21%, #2E7D32 21% 21.4%, transparent 21.4% 100%),
        linear-gradient(-18deg, transparent 0 34%, #2E7D32 34% 34.35%, transparent 34.35% 100%),
        radial-gradient(circle at 16% 72%, #2E7D32 0 5px, transparent 6px),
        radial-gradient(circle at 42% 38%, #2E7D32 0 4px, transparent 5px),
        radial-gradient(circle at 76% 58%, #2E7D32 0 5px, transparent 6px),
        radial-gradient(circle at 88% 18%, #2E7D32 0 4px, transparent 5px);
    }

    .problem-metric {
      position: relative;
      overflow: hidden;
      border: 1px solid #E6EAE7;
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(247,251,248,0.94)),
        #FFFFFF;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.04);
      opacity: 0;
      transform: translateY(40px);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .problem-metric::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(46,125,50,0.08), transparent 34%),
        repeating-linear-gradient(90deg, transparent 0 28px, rgba(46,125,50,0.045) 28px 29px);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .problem-metric::after {
      content: "";
      position: absolute;
      right: 22px;
      top: 22px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #57A773;
      box-shadow: 0 0 0 8px rgba(87,167,115,0.12), 0 0 22px rgba(87,167,115,0.36);
    }

    .problem-metric.visible {
      animation: metricIn 0.8s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .problem-metric:nth-child(2).visible { animation-delay: 150ms; }
    .problem-metric:nth-child(3).visible { animation-delay: 300ms; }
    .problem-metric:nth-child(4).visible { animation-delay: 450ms; }

    .problem-metric:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.08);
      border-color: rgba(46,125,50,0.28);
    }

    .problem-metric:hover::before {
      opacity: 1;
    }

    .problem-metric strong {
      position: relative;
      z-index: 1;
      display: block;
      margin: 0 0 14px;
      color: transparent;
      background: linear-gradient(105deg, #07120f 0%, #0F5132 48%, #57A773 100%);
      background-clip: text;
      -webkit-background-clip: text;
      font-size: clamp(44px, 4.4vw, 64px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -3px;
    }

    .problem-metric h3,
    .path-card h3,
    .production-card h3,
    .reserved-panel h3 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .problem-metric h3 {
      position: relative;
      z-index: 1;
      font-size: 20px;
      font-weight: 700;
    }

    .problem-metric p,
    .path-card p,
    .production-card p,
    .reserved-panel p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 16px;
    }

    .problem-metric p {
      position: relative;
      z-index: 1;
      color: #7A847D;
      font-size: 15px;
    }

    .problem-metric:nth-child(1) {
      background:
        radial-gradient(circle at 92% 10%, rgba(87,167,115,0.2), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(245,251,247,0.96));
    }

    .problem-metric:nth-child(2) {
      background:
        radial-gradient(circle at 92% 10%, rgba(46,125,50,0.18), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(242,249,245,0.96));
    }

    .problem-metric:nth-child(3) {
      background:
        radial-gradient(circle at 92% 10%, rgba(79,125,148,0.16), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(246,250,248,0.96));
    }

    .problem-metric:nth-child(4) {
      background:
        radial-gradient(circle at 92% 10%, rgba(176,138,67,0.14), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(249,250,246,0.96));
    }

    .problem-close {
      grid-column: 1 / -1;
      position: relative;
      width: min(980px, 100%);
      max-width: 980px;
      margin: 36px auto 0;
      text-align: center;
      border-top: 1px solid rgba(46,125,50,0.18);
      border-radius: 0;
      padding: 34px 0 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .problem-close::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -2px;
      width: 86px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0F5132, #2E7D32, #57A773);
      transform: translateX(-50%);
    }

    .problem-close strong {
      display: block;
      max-width: 900px;
      margin: 0 auto;
      color: #0A0A0A;
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1.06;
      letter-spacing: -1px;
    }

    .problem-close span {
      display: block;
      margin-top: 14px;
      color: #5F6762;
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.35;
    }

    @keyframes metricIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cinema {
      min-height: auto;
      background: var(--ink);
      color: var(--white);
    }

    .cinema::before {
      content: "";
      position: absolute;
      inset: 0;

    function mergeTranslations(target, source) {
      Object.entries(source).forEach(([language, sections]) => {
        target[language] = target[language] || {};
        Object.entries(sections).forEach(([section, values]) => {
          target[language][section] = Object.assign({}, target[language][section], values);
        });
      });
    }

    mergeTranslations(translations, positioningTranslations);

    const supportedLanguages = Object.keys(translations);
    const defaultLanguage = "it";
    const languageSelect = document.querySelector("#languageSelect");

    function getTranslation(path, language) {
      return path.split(".").reduce((value, key) => value && value[key], translations[language]);
    }

    function applyTranslations(language) {
      const activeLanguage = translations[language] ? language : defaultLanguage;
      document.documentElement.lang = activeLanguage;

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const value = getTranslation(element.dataset.i18n, activeLanguage);
        if (typeof value === "string") {
          element.textContent = value;
        }
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        const value = getTranslation(element.dataset.i18nPlaceholder, activeLanguage);
        if (typeof value === "string") {
          element.setAttribute("placeholder", value);
        }
      });

      document.querySelectorAll("[data-i18n-title]").forEach((element) => {
        const value = getTranslation(element.dataset.i18nTitle, activeLanguage);
        if (typeof value === "string") {
          element.setAttribute("title", value);
          element.setAttribute("aria-label", value);
        }
      });

      localStorage.setItem("amalisLanguage", activeLanguage);
      languageSelect.value = activeLanguage;
    }

    function populateLanguageSelect() {
      languageSelect.innerHTML = "";
      supportedLanguages.forEach((language) => {
        const option = document.createElement("option");
        option.value = language;
        option.textContent = translations[language].nav.languageName;
        languageSelect.appendChild(option);
      });
    }

    function initI18n() {
      populateLanguageSelect();
      const savedLanguage = localStorage.getItem("amalisLanguage");
      const browserLanguage = navigator.language && navigator.language.slice(0, 2);
      const initialLanguage = translations[savedLanguage]
        ? savedLanguage
        : translations[browserLanguage]
          ? browserLanguage
          : defaultLanguage;

      applyTranslations(initialLanguage);
      languageSelect.addEventListener("change", (event) => applyTranslations(event.target.value));
    }

    function initReveal() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      }, { threshold: 0.16 });

      document.querySelectorAll(".reveal").forEach((element) => observer.observe(element));
    }

    function initCanvas() {
      const canvas = document.querySelector("#orbitCanvas");
      const context = canvas.getContext("2d");
      const visual = canvas.parentElement;
      let width = 0;
      let height = 0;
      let frame = 0;

      function resize() {
        const ratio = window.devicePixelRatio || 1;
        width = visual.clientWidth;
        height = visual.clientHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function draw() {
        frame += 0.01;
        context.clearRect(0, 0, width, height);
        const nodes = [
          { x: 0.09, y: 0.74, r: 4.8, depth: 1 },
          { x: 0.2, y: 0.55, r: 3.4, depth: 0.72 },
          { x: 0.31, y: 0.82, r: 4.2, depth: 0.9 },
          { x: 0.43, y: 0.45, r: 3.6, depth: 0.74 },
          { x: 0.52, y: 0.64, r: 4.4, depth: 1 },
          { x: 0.61, y: 0.38, r: 3.1, depth: 0.62 },
          { x: 0.73, y: 0.55, r: 3.8, depth: 0.8 },
          { x: 0.86, y: 0.34, r: 3.2, depth: 0.58 },
          { x: 0.9, y: 0.68, r: 4.1, depth: 0.86 }
        ];

        const links = [
          [0, 1], [0, 2], [1, 3], [2, 4], [3, 4],
          [3, 5], [4, 6], [5, 7], [6, 7], [6, 8], [2, 8]
        ];

        links.forEach(([from, to], index) => {
          const a = nodes[from];
          const b = nodes[to];
          const ax = a.x * width;
          const ay = a.y * height;
          const bx = b.x * width;
          const by = b.y * height;
          const pulse = (Math.sin(frame * 2.2 + index * 0.7) + 1) / 2;
          const gradient = context.createLinearGradient(ax, ay, bx, by);
          gradient.addColorStop(0, "rgba(211,255,218,0.18)");
          gradient.addColorStop(0.5, `rgba(124,244,154,${0.32 + pulse * 0.28})`);
          gradient.addColorStop(1, "rgba(211,255,218,0.18)");

          context.beginPath();
          context.moveTo(ax, ay);
          context.lineTo(bx, by);
          context.strokeStyle = gradient;
          context.lineWidth = 1.2 + pulse * 0.9;
          context.shadowColor = "rgba(127,255,164,0.45)";
          context.shadowBlur = 8 + pulse * 12;
          context.stroke();
          context.shadowBlur = 0;

          const travel = (frame * (0.22 + index * 0.01) + index * 0.137) % 1;
          const dotX = ax + (bx - ax) * travel;
          const dotY = ay + (by - ay) * travel;
          context.beginPath();
          context.arc(dotX, dotY, 2.2 + pulse * 1.6, 0, Math.PI * 2);
          context.fillStyle = "rgba(232,255,236,0.92)";
          context.shadowColor = "rgba(127,255,164,0.86)";
          context.shadowBlur = 18;
          context.fill();
          context.shadowBlur = 0;
        });

        nodes.forEach((node, index) => {
          const x = node.x * width;
          const y = node.y * height;
          const pulse = (Math.sin(frame * 3 + index) + 1) / 2;
          const radius = node.r + pulse * 2.2;

          context.beginPath();
          context.arc(x, y, radius * 3.2, 0, Math.PI * 2);
          context.fillStyle = `rgba(138,255,164,${0.08 + node.depth * 0.08})`;
          context.fill();

          context.beginPath();
          context.arc(x, y, radius, 0, Math.PI * 2);
          context.fillStyle = `rgba(224,255,229,${0.72 + node.depth * 0.18})`;
          context.shadowColor = "rgba(113,255,146,0.92)";
          context.shadowBlur = 16 + node.depth * 12;
          context.fill();
          context.shadowBlur = 0;
        });

        requestAnimationFrame(draw);
      }

      resize();
      window.addEventListener("resize", resize);
      draw();
    }

    function initFooterYear() {
      const footerYear = document.querySelector("#footerYear");
      if (footerYear) {
        footerYear.textContent = new Date().getFullYear();
      }
    }

    initI18n();
    initReveal();
    initCanvas();
    initFooterYear();
  </script>
