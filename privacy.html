<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Privacy Policy Amalis Urban Farm">
  <title>Privacy Policy | Amalis Urban Farm</title>
  <link rel="icon" href="assets/amalis-logo.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #07120f;
      --muted: #62706a;
      --line: rgba(7, 18, 15, 0.12);
      --green: #1b7a4a;
      --green-2: #5cb883;
      --white: #ffffff;
      --header: 72px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--white);
      scroll-behavior: smooth;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(180deg, rgba(238, 244, 240, 0.72), rgba(255,255,255,0) 360px),
        #ffffff;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    select { font: inherit; }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: var(--header);
      border-bottom: 1px solid rgba(7, 18, 15, 0.08);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
    }

    .nav-shell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: min(1180px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
    }

    .brand-logo {
      display: block;
      width: clamp(158px, 16vw, 230px);
      height: 42px;
      object-fit: contain;
      object-position: left center;
    }

    .nav-links,
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links {
      font-size: 13px;
      color: rgba(7, 18, 15, 0.72);
    }

    .nav-links a,
    .footer-links a,
    .footer-company a {
      transition: color 0.25s ease;
    }

    .nav-links a:hover,
    .footer-links a:hover,
    .footer-company a:hover {
      color: var(--green-2);
    }

    .language-select {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 34px 0 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.82);
      cursor: pointer;
    }

    .nav-login,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 1px solid rgba(7, 18, 15, 0.14);
      border-radius: 8px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 700;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .nav-login,
    .btn.primary {
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 18px 46px rgba(7, 18, 15, 0.18);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.72);
      color: var(--ink);
    }

    .nav-login:hover,
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 52px rgba(7, 18, 15, 0.17);
    }

    main {
      padding-top: var(--header);
    }

    .legal-hero,
    .legal-body {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .legal-hero {
      padding: 96px 0 56px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: currentColor;
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(48px, 7vw, 96px);
      line-height: 0.95;
      letter-spacing: -4px;
    }

    .lead {
      max-width: 820px;
      margin: 32px 0 0;
      color: var(--muted);
      font-size: clamp(19px, 2vw, 24px);
      line-height: 1.5;
    }

    .updated {
      display: inline-flex;
      margin-top: 34px;
      border: 1px solid rgba(27,122,74,0.18);
      border-radius: 999px;
      padding: 10px 14px;
      color: rgba(7,18,15,0.72);
      background: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 700;
    }

    .legal-body {
      display: grid;
      grid-template-columns: minmax(220px, 0.28fr) minmax(0, 0.72fr);
      gap: 56px;
      padding: 0 0 96px;
      align-items: start;
    }

    .legal-toc {
      position: sticky;
      top: calc(var(--header) + 28px);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 15px 35px rgba(7,18,15,0.05);
    }

    .legal-toc strong {
      display: block;
      margin-bottom: 14px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
    }

    .legal-toc a {
      display: block;
      padding: 9px 0;
      color: rgba(7,18,15,0.72);
      font-size: 14px;
      line-height: 1.3;
    }

    .legal-content {
      display: grid;
      gap: 22px;
    }

    .legal-card {
      border: 1px solid #e7ece8;
      border-radius: 24px;
      padding: 32px;
      background: #ffffff;
      box-shadow: 0 14px 40px rgba(7,18,15,0.04);
    }

    .legal-card h2 {
      margin: 0 0 18px;
      color: var(--ink);
      font-size: clamp(25px, 2.5vw, 34px);
      line-height: 1.08;
      letter-spacing: -1px;
    }

    .legal-card h3 {
      margin: 26px 0 10px;
      font-size: 18px;
      line-height: 1.2;
    }

    .legal-card p,
    .legal-card li {
      color: #5f6a64;
      font-size: 16px;
      line-height: 1.75;
    }

    .legal-card p {
      margin: 0 0 14px;
    }

    .legal-card p:last-child {
      margin-bottom: 0;
    }

    .legal-card ul {
      margin: 0;
      padding-left: 20px;
    }

    .legal-card li + li {
      margin-top: 8px;
    }

    .company-box {
      border: 1px solid rgba(27,122,74,0.18);
      border-radius: 16px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(92,184,131,0.08), rgba(255,255,255,0.8));
    }

    .company-box p {
      color: #34413b;
      font-weight: 650;
    }

    .site-footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      background: #07120F;
    }

    .footer-inner {
      width: min(1400px, calc(100% - 40px));
      margin: 0 auto;
      padding: 80px 0 40px;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 0.75fr);
      gap: 80px;
    }

    .footer-brand {
      margin: 0 0 18px;
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
    }

    .footer-text {
      max-width: 380px;
      margin: 0;
      color: rgba(255,255,255,0.65);
      font-size: 16px;
      line-height: 1.7;
    }

    .footer-title {
      display: block;
      margin: 0 0 18px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
    }

    .footer-company,
    .footer-links {
      color: rgba(255,255,255,0.65);
      font-size: 15px;
      line-height: 1.8;
    }

    .footer-company p { margin: 0; }

    .footer-links {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .footer-separator {
      margin: 60px 0 30px;
      border: 0;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .footer-copyright { color: rgba(255,255,255,0.55); }

    .footer-claim {
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.5px;
    }

    @media (max-width: 940px) {
      .nav-links { display: none; }

      .legal-body {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .legal-toc {
        position: static;
      }

      .footer-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 60px;
      }
    }

    @media (max-width: 640px) {
      :root { --header: 66px; }

      .nav-shell,
      .legal-hero,
      .legal-body,
      .footer-inner {
        width: min(100% - 28px, 1180px);
      }

      .brand-logo {
        width: 138px;
        height: 38px;
      }

      .language-select { width: 74px; }

      .nav-login { display: none; }

      .legal-hero {
        padding: 68px 0 42px;
      }

      h1 {
        font-size: 48px;
        letter-spacing: -2px;
      }

      .legal-card {
        padding: 24px;
        border-radius: 18px;
      }

      .footer-inner { padding-top: 64px; }

      .footer-grid {
        grid-template-columns: 1fr;
        gap: 40px;
        text-align: center;
      }

      .footer-text { margin: 0 auto; }

      .footer-links { justify-items: center; }

      .footer-bottom {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>

    const supportedLanguages = Object.keys(translations);
    const defaultLanguage = "it";
    const languageSelect = document.querySelector("#languageSelect");

    function getTranslation(path, language) {
      return path.split(".").reduce((value, key) => value && value[key], translations[language]);
    }

    function applyTranslations(language) {
      const activeLanguage = translations[language] ? language : defaultLanguage;
      document.documentElement.lang = activeLanguage;
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const value = getTranslation(element.dataset.i18n, activeLanguage);
        if (typeof value === "string") element.textContent = value;
      });
      document.querySelectorAll("[data-i18n-title]").forEach((element) => {
        const value = getTranslation(element.dataset.i18nTitle, activeLanguage);
        if (typeof value === "string") {
          element.setAttribute("title", value);
          element.setAttribute("aria-label", value);
        }
      });
      localStorage.setItem("amalisLanguage", activeLanguage);
      languageSelect.value = activeLanguage;
      document.title = `${translations[activeLanguage].page.title} | Amalis Urban Farm`;
    }

    function populateLanguageSelect() {
      supportedLanguages.forEach((language) => {
        const option = document.createElement("option");
        option.value = language;
        option.textContent = translations[language].nav.languageName;
        languageSelect.appendChild(option);
      });
    }

    function initI18n() {
      populateLanguageSelect();
      const savedLanguage = localStorage.getItem("amalisLanguage");
      const browserLanguage = navigator.language && navigator.language.slice(0, 2);
      const initialLanguage = translations[savedLanguage] ? savedLanguage : translations[browserLanguage] ? browserLanguage : defaultLanguage;
      applyTranslations(initialLanguage);
      languageSelect.addEventListener("change", (event) => applyTranslations(event.target.value));
    }

    function initFooterYear() {
      const footerYear = document.querySelector("#footerYear");
      if (footerYear) footerYear.textContent = new Date().getFullYear();
    }

    initI18n();
    initFooterYear();
  </script>
